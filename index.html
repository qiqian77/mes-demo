<svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-grid" viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="6" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-wave" viewBox="0 0 20 20"><path d="M1.5 10h3l2-5 3 10 2.5-7 2 4h4.5"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M4.5 10h3l1.5-3 2.5 6 1.5-3h2.5"/></symbol>

</svg>

<div class="ambient" aria-hidden="true">
  <span class="ambient__blob ambient__blob--a"></span>
  <span class="ambient__blob ambient__blob--b"></span>
  <span class="ambient__blob ambient__blob--c"></span>

    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>

        <div class="brand-name">车间设备运维台</div>

      </div>
    </div>

    <div class="nav-label">工作台</div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-nav="dashboard"><svg><use href="#i-grid"/></svg><span>车间总览</span></a>
      <a href="#/signal" data-nav="signal"><svg><use href="#i-wave"/></svg><span>数据与清洗</span></a>

      <div class="topbar-right">
        <span class="topbar-time" id="clock">--:--:--</span>
        <span class="tag tag--quiet">演示环境</span>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
